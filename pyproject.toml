[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-bluetooth-audio-diagnostics"
version = "0.1.0.dev0"
description = "Diagnostic toolkit for Linux Bluetooth audio environments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbus-fast>=5.0.22,<6",
    "typer>=0.27.2,<0.28",
]

[project.scripts]
bt-audio-diag = "bt_audio_diag.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src", "tests"]
